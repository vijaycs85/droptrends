name: Mirror to Drupal.org

on:
  push:
    branches:
      - 1.x
    tags:
      - '*'

jobs:
  mirror-to-drupal:
    runs-on: ubuntu-latest
    env:
      DRUPAL_SSH_KEY: ${{ secrets.DRUPAL_SSH_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH for Drupal.org
        if: env.DRUPAL_SSH_KEY != ''
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$DRUPAL_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H git.drupal.org >> ~/.ssh/known_hosts 2>/dev/null || true
          cat << 'EOF' > ~/.ssh/config
          Host git.drupal.org
            HostName git.drupal.org
            User git
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      - name: Push to Drupal.org repository
        if: env.DRUPAL_SSH_KEY != ''
        run: |
          git remote add drupal git@git.drupal.org:project/droptrends.git || git remote set-url drupal git@git.drupal.org:project/droptrends.git
          git push --tags drupal 1.x
