<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DropTrends</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="dt-popup-container">
    <header class="dt-popup-header">
      <div class="dt-popup-brand">
        <svg class="dt-popup-logo" viewBox="0 0 128 128" fill="none">
          <defs>
            <linearGradient id="popup-grad" x1="15%" y1="0%" x2="85%" y2="100%">
              <stop offset="0%" stop-color="#009cde" />
              <stop offset="50%" stop-color="#0284c7" />
              <stop offset="100%" stop-color="#0369a1" />
            </linearGradient>
          </defs>
          <g transform="translate(64, 64) scale(1.06, 1.06) translate(-64, -58.7)">
            <path d="M 96.8 54.3 C 96.5 53.8 96.2 53.3 95.8 52.8 C 94.1 50.6 91.8 48.6 89.8 46.8 C 86.8 44.1 83.7 41.5 81.2 38.4 C 77.3 33.6 74.4 28.1 72.1 22.3 C 70.3 17.7 69 13 67.9 8.2 C 67.4 5.9 66.8 3.5 66.2 1.3 C 65.9 0.4 65.4 -0.1 64.4 0 C 63.6 0.1 63 0.6 62.7 1.4 C 61.8 4.2 60.9 7 60.2 9.9 C 58.5 16.7 56.4 23.4 53 29.6 C 50.1 35 46.2 39.7 42.1 44.2 C 38.6 48 34.6 51.5 31.6 55.9 C 27.2 62.3 25.1 69.8 25 77.6 C 24.9 84.8 27.2 91.5 31.1 97.5 C 36.3 105.7 43.6 111.4 52.6 114.7 C 60.1 117.5 67.9 117.5 75.4 114.7 C 84.4 111.4 91.7 105.7 96.9 97.5 C 100.8 91.5 103.1 84.8 103 77.6 C 102.9 69.3 100.7 61.3 96.8 54.3 Z" fill="url(#popup-grad)" />
            <path d="M 64 12 C 55 24 38 48 35 68 C 33 76 35 84 39 90" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2.5" stroke-linecap="round" />
          </g>
          <rect x="38" y="80" width="14" height="32" rx="4" fill="#ef4444" />
          <rect x="57" y="62" width="14" height="50" rx="4" fill="#f59e0b" />
          <rect x="76" y="44" width="14" height="68" rx="4" fill="#7cbc48" />
          <path d="M 34 78 L 94 34" stroke="#ffffff" stroke-width="11" stroke-linecap="round" />
          <path d="M 72 34 L 94 34 L 94 54" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M 34 78 L 94 34" stroke="#7cbc48" stroke-width="6.5" stroke-linecap="round" />
          <path d="M 72 34 L 94 34 L 94 54" fill="none" stroke="#7cbc48" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="dt-brand-title">DropTrends</span>
      </div>
      <span class="dt-version-badge">v1.1.0</span>
    </header>

    <main class="dt-popup-main">
      <!-- Active Module View -->
      <section id="dt-active-view" class="dt-view dt-hidden">
        <div class="dt-card">
          <div class="dt-card-header">
            <div class="dt-header-title-block">
              <h2 id="dt-module-title" class="dt-module-title">Token</h2>
              <span id="dt-module-machine" class="dt-module-machine">drupal/token</span>
            </div>
            <div class="dt-hero-score-lockup">
              <div class="dt-hero-gauge-dial">
                <svg class="dt-hero-gauge-svg" width="50" height="50" viewBox="0 0 50 50">
                  <circle class="dt-gauge-bg" cx="25" cy="25" r="21" fill="none" stroke="#e2e8f0" stroke-width="3.8"/>
                  <circle id="dt-score-circle" class="dt-gauge-arc" cx="25" cy="25" r="21" fill="none" stroke="#059669" stroke-width="3.8"
                    stroke-dasharray="131.95" stroke-dashoffset="5.28"
                    stroke-linecap="round" transform="rotate(-90 25 25)"/>
                </svg>
                <span id="dt-score-val" class="dt-hero-score-val">96</span>
              </div>
              <span id="dt-score-label" class="dt-hero-grade-chip">Exceptional</span>
            </div>
          </div>

          <div class="dt-meta-row">
            <span id="dt-sec-tag" class="dt-tag dt-tag-sec">Security Covered</span>
            <span id="dt-d11-tag" class="dt-tag dt-tag-d11">D11 Ready</span>
          </div>

          <div id="dt-popup-disclaimer" class="dt-popup-disclaimer dt-hidden"></div>

          <div class="dt-pillars-compact">
            <div class="dt-pillar-mini">
              <span>Security</span>
              <strong id="dt-pillar-sec">25/25</strong>
            </div>
            <div class="dt-pillar-mini">
              <span>Maintenance</span>
              <strong id="dt-pillar-maint">22/25</strong>
            </div>
            <div class="dt-pillar-mini">
              <span>Modernity</span>
              <strong id="dt-pillar-mod">20/20</strong>
            </div>
            <div class="dt-pillar-mini">
              <span>Quality & CI</span>
              <strong id="dt-pillar-qual">15/15</strong>
            </div>
            <div class="dt-pillar-mini">
              <span>Adoption</span>
              <strong id="dt-pillar-adopt">15/15</strong>
            </div>
          </div>

          <div class="dt-card-footer">
            <button id="dt-open-page-btn" class="dt-btn-primary">Open Breakdown Drawer</button>
          </div>
        </div>
      </section>

      <!-- Search & Jump View -->
      <section id="dt-search-view" class="dt-view">
        <div class="dt-search-hero">
          <p class="dt-search-tagline">Evaluate any Drupal module with objective 0-100 DropScore metrics.</p>
          <form id="dt-search-form" class="dt-search-box">
            <input type="text" id="dt-search-input" placeholder="e.g. token, pathauto, flowdrop" autocomplete="off" required>
            <button type="submit" class="dt-btn-primary">Inspect</button>
          </form>
        </div>

        <div id="dt-recent-section" class="dt-recent-section dt-hidden">
          <h3 class="dt-recent-heading">Recently Inspected</h3>
          <ul id="dt-recent-list" class="dt-recent-list"></ul>
        </div>
      </section>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
